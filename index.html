<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chấm Công Phòng</title>

<!-- Fonts: Fraunces (display) + Plus Jakarta Sans (body) + JetBrains Mono (nums) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Firebase 10.8.0 compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- React 18 + Babel -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
/* Hallmark · macrostructure: Component Playground · tone: warm · anchor hue: moss */
:root {
  font-synthesis: none;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", monospace;

  --bg: oklch(0.975 0.01 95);
  --surface: oklch(0.99 0.005 95);
  --surface-subtle: oklch(0.955 0.012 95);
  --surface-border: oklch(0.88 0.015 90);
  --text: oklch(0.22 0.02 80);
  --text-muted: oklch(0.52 0.02 85);
  --text-dim: oklch(0.68 0.015 90);

  --accent: oklch(0.55 0.12 145);        /* deep moss */
  --accent-ink: oklch(0.99 0.005 95);
  --accent-subtle: oklch(0.93 0.03 145);
  
  --ticket: oklch(0.68 0.14 65);        /* warm amber */
  --ticket-ink: oklch(0.25 0.05 65);
  --ticket-subtle: oklch(0.94 0.04 65);

  --streak: oklch(0.65 0.19 35);        /* flame orange */
  --streak-ink: oklch(0.99 0.005 35);
  --streak-subtle: oklch(0.94 0.05 35);

  --danger: oklch(0.58 0.18 25);
  --danger-ink: oklch(0.98 0.01 25);
  --danger-subtle: oklch(0.94 0.04 25);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px oklch(0.2 0.02 80 / 0.04);
  --shadow-md: 0 4px 12px -2px oklch(0.2 0.02 80 / 0.06);
  --shadow-lg: 0 12px 24px -6px oklch(0.2 0.02 80 / 0.08);
}

[data-theme="dark"] {
  --bg: oklch(0.16 0.01 95);
  --surface: oklch(0.20 0.012 95);
  --surface-subtle: oklch(0.24 0.015 95);
  --surface-border: oklch(0.30 0.015 90);
  --text: oklch(0.94 0.01 95);
  --text-muted: oklch(0.70 0.015 90);
  --text-dim: oklch(0.50 0.015 90);

  --accent: oklch(0.65 0.12 145);
  --accent-ink: oklch(0.14 0.02 145);
  --accent-subtle: oklch(0.25 0.03 145);
  
  --ticket: oklch(0.75 0.13 65);
  --ticket-ink: oklch(0.18 0.04 65);
  --ticket-subtle: oklch(0.26 0.04 65);

  --streak: oklch(0.72 0.18 35);
  --streak-ink: oklch(0.18 0.02 35);
  --streak-subtle: oklch(0.28 0.05 35);

  --danger: oklch(0.65 0.16 25);
  --danger-ink: oklch(0.18 0.02 25);
  --danger-subtle: oklch(0.26 0.04 25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: clip; min-height: 100dvh; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
}

button {
  font-family: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.app-container { max-width: 440px; margin: 0 auto; padding: 0 16px; }

/* Top Header */
.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--surface-border);
}
.brand-group { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
}
.brand-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; line-height: 1.1; }
.brand-status { font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
.status-dot.active { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }

.header-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--surface-border);
  color: var(--text-muted); display: grid; place-items: center;
  transition: all 150ms ease;
}
.btn-icon:hover { color: var(--text); background: var(--surface-subtle); }

/* Section Label */
.section-label {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); margin: 20px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--surface-border); }

/* Streak Card Header */
.streak-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg); padding: 12px 10px; box-shadow: var(--shadow-sm);
}
.streak-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border-radius: var(--radius-sm); background: var(--surface-subtle);
  border: 1px solid transparent; transition: all 150ms ease;
}
.streak-item.has-streak {
  background: var(--streak-subtle); border-color: color-mix(in srgb, var(--streak) 30%, transparent);
}
.streak-avatar {
  font-size: 0.75rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.streak-count {
  display: flex; align-items: center; gap: 2px;
  font-size: 0.72rem; font-weight: 700; color: var(--text-dim);
}
.streak-item.has-streak .streak-count { color: var(--streak); }

/* Reward Card */
.reward-box {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm);
}
.reward-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.reward-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--ticket-subtle); color: var(--ticket-ink);
  font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-full);
}
.reward-help { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 14px; }
.member-bars { display: flex; flex-direction: column; gap: 10px; }
.member-bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.member-bar-name { font-size: 0.88rem; font-weight: 600; min-width: 44px; }
.progress-track { flex: 1; height: 8px; background: var(--surface-subtle); border-radius: 99px; overflow: hidden; }
.progress-value { height: 100%; background: var(--accent); border-radius: 99px; transition: width 300ms ease; }
.member-bar-stat { display: flex; align-items: center; gap: 6px; }
.progress-text { font-size: 0.75rem; color: var(--text-muted); }
.ticket-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--ticket-subtle); color: var(--ticket-ink);
  font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 6px;
}

/* Tasks */
.task-grid { display: flex; flex-direction: column; gap: 12px; }
.task-box {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 12px;
}
.task-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.task-meta { display: flex; align-items: center; gap: 12px; min-width: 0; }
.task-icon-wrap {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface-subtle); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.task-name { font-family: var(--font-display); font-size: 0.98rem; font-weight: 600; line-height: 1.2; }
.task-recent { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.btn-add-log {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--text); color: var(--bg);
  display: grid; place-items: center; flex-shrink: 0;
  transition: all 150ms ease;
}
.btn-add-log:hover { background: var(--accent); color: var(--accent-ink); }

/* Horizontal History Strip inside task card */
.task-strip-wrap {
  position: relative; border-top: 1px solid var(--surface-border);
  padding-top: 10px; margin: 0 -4px;
}
.task-strip {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 2px 4px 4px; scrollbar-width: none;
}
.task-strip::-webkit-scrollbar { display: none; }
.log-pill {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  background: var(--surface-subtle); border: 1px solid var(--surface-border);
  border-radius: 12px; padding: 4px 8px 4px 10px; font-size: 0.78rem;
}
.log-pill-date { font-size: 0.7rem; color: var(--text-muted); }
.log-pill-name {
  background: var(--text); color: var(--bg);
  font-weight: 600; font-size: 0.72rem; padding: 2px 6px; border-radius: 6px;
}
.log-pill-sub { font-size: 0.68rem; color: var(--text-muted); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-pill-exempt {
  background: var(--ticket-subtle); color: var(--ticket-ink);
  font-size: 0.65rem; font-weight: 700; padding: 2px 5px; border-radius: 4px;
}
.log-pill-del {
  width: 20px; height: 20px; border-radius: 6px;
  display: grid; place-items: center; color: var(--danger);
  background: var(--danger-subtle);
}
.strip-empty { font-size: 0.78rem; color: var(--text-dim); font-style: italic; padding: 4px 0; }

/* Leaderboard */
.rank-box {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow-sm);
}
.rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-border); }
.rank-row:last-child { border-bottom: none; }
.rank-num {
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.75rem; font-weight: 700;
  background: var(--surface-subtle); color: var(--text-muted);
}
.rank-num.top1 { background: var(--ticket); color: var(--ticket-ink); }
.rank-num.top2 { background: var(--surface-border); color: var(--text); }
.rank-num.top3 { background: oklch(0.7 0.08 55); color: #fff; }
.rank-main { flex: 1; }
.rank-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
.rank-count { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }
.rank-bar { height: 6px; background: var(--surface-subtle); border-radius: 99px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 300ms ease; }

/* Monthly Achievements & Badges */
.achieve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.achieve-card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.achieve-badge-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--ticket-subtle); color: var(--ticket-ink);
  display: grid; place-items: center; font-size: 1rem;
}
.achieve-title { font-size: 0.78rem; font-weight: 700; color: var(--text); line-height: 1.2; }
.achieve-winner { font-size: 0.88rem; font-weight: 700; color: var(--accent); margin-top: 2px; }
.achieve-score { font-size: 0.7rem; color: var(--text-muted); }

/* Full History Tab */
.history-feed { display: flex; flex-direction: column; gap: 10px; }
.feed-card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md); padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.feed-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.feed-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-subtle); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.feed-title { font-size: 0.88rem; font-weight: 600; }
.feed-sub { font-size: 0.75rem; color: var(--text-muted); }
.feed-date { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
.btn-del-log {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--danger-subtle); color: var(--danger);
  display: grid; place-items: center; flex-shrink: 0;
}

/* Bottom Navigation */
.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  max-width: 440px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-around;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--surface-border);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 0; border-radius: 12px; color: var(--text-muted);
  font-size: 0.7rem; font-weight: 600; transition: all 150ms ease;
}
.nav-btn.active { color: var(--accent); background: var(--accent-subtle); }
.nav-btn.admin-active { color: var(--danger); background: var(--danger-subtle); }

/* Bottom Sheet Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: oklch(0.1 0.02 80 / 0.5); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 480px) {
  .modal-overlay { align-items: center; padding: 16px; }
}
.modal-sheet {
  background: var(--bg); width: 100%; max-width: 440px;
  border-radius: 24px 24px 0 0; border: 1px solid var(--surface-border);
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 85dvh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: slideUp 200ms ease;
}
@media (min-width: 480px) { .modal-sheet { border-radius: 24px; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.sheet-handle { width: 36px; height: 4px; background: var(--surface-border); border-radius: 99px; margin: 0 auto 16px; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.sheet-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

/* Action Buttons inside modal */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.member-select-btn {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md); padding: 14px; text-align: left;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 150ms ease;
}
.member-select-btn:hover { border-color: var(--accent); background: var(--surface-subtle); }
.member-select-name { font-size: 0.95rem; font-weight: 600; }
.member-select-tag {
  font-size: 0.65rem; font-weight: 700; color: var(--ticket-ink);
  background: var(--ticket-subtle); padding: 2px 6px; border-radius: 4px; margin-top: 4px;
}

.subtask-btn {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md); padding: 12px; font-size: 0.82rem; font-weight: 500;
  text-align: left; transition: all 150ms ease;
}
.subtask-btn.selected { border-color: var(--accent); background: var(--accent-subtle); color: var(--accent); font-weight: 700; }

input[type="text"], input[type="password"], textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
  background: var(--surface); border: 1px solid var(--surface-border);
  color: var(--text); font-family: inherit; font-size: 0.88rem;
  transition: border-color 150ms ease;
}
input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

.btn-primary {
  width: 100%; padding: 14px; border-radius: var(--radius-md);
  background: var(--accent); color: var(--accent-ink);
  font-size: 0.9rem; font-weight: 700; display: grid; place-items: center;
}
.btn-secondary {
  width: 100%; padding: 14px; border-radius: var(--radius-md);
  background: var(--surface-subtle); color: var(--text);
  font-size: 0.9rem; font-weight: 600; display: grid; place-items: center;
}
.btn-danger {
  width: 100%; padding: 14px; border-radius: var(--radius-md);
  background: var(--danger); color: var(--danger-ink);
  font-size: 0.9rem; font-weight: 700; display: grid; place-items: center;
}

.alert-banner {
  background: var(--danger-subtle); border: 1px solid var(--danger);
  color: var(--danger); border-radius: var(--radius-md);
  padding: 10px 14px; font-size: 0.8rem; margin-bottom: 12px;
}
</style>
</head>
<body data-theme="light">
<div id="root"></div>

let db = null;
let auth = null;
const appId = 'room-chore-manager-v2';

function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('chore_theme') || 'light');
  const [user, setUser] = useState(null);
  const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);
  const [firebaseInputConfig, setFirebaseInputConfig] = useState('');
  const [showConfigModal, setShowConfigModal] = useState(false);
  const [syncError, setSyncError] = useState('');

  const [isAdmin, setIsAdmin] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);
  const [adminPassword, setAdminPassword] = useState('');
  const [adminError, setAdminError] = useState('');
  const [logToDelete, setLogToDelete] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);

  const [members, setMembers] = useState([
    { id: 'tin', name: 'Tín', khacCount: 0, exemptTickets: 0 },
    { id: 'phuc', name: 'Phúc', khacCount: 0, exemptTickets: 0 },
    { id: 'ho', name: 'Hồ', khacCount: 0, exemptTickets: 0 },
    { id: 'phong', name: 'Phong', khacCount: 0, exemptTickets: 0 },
    { id: 'bao', name: 'Bảo', khacCount: 0, exemptTickets: 0 }
  ]);

  const [logs, setLogs] = useState([]);
  const [activeTaskForLog, setActiveTaskForLog] = useState(null);
  const [customOtherText, setCustomOtherText] = useState('');
  const [activeTab, setActiveTab] = useState('home'); // 'home' | 'monthly' | 'history'

  const tasks = [
    { id: 'do_rac', name: 'Đổ rác', icon: Icons.Trash },
    { id: 'don_ve_sinh', name: 'Dọn nhà vệ sinh', icon: Icons.Sparkles },
    { id: 'don_bep', name: 'Dọn bếp', icon: Icons.Chef },
    { id: 'khac', name: 'Việc Khác', icon: Icons.PlusCircle, hasSubtasks: true }
  ];

  const subTasks = [
    { id: 'do_rac_bon_rua', name: 'Đổ rác bồn rửa' },
    { id: 'khac_tuy_chinh', name: 'Khác (Tự ghi chú...)' }
  ];

  const defaultOrder = ['tin', 'phuc', 'ho', 'phong', 'bao'];

  // Theme effect
  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('chore_theme', theme);
  }, [theme]);

  const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

  // Firebase Config Parser
  const extractFirebaseConfig = (rawString) => {
    try {
      return JSON.parse(rawString);
    } catch (e) {
      try {
        const jsonMatch = rawString.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const configObject = (new Function('return ' + jsonMatch[0]))();
          if (configObject.apiKey && configObject.projectId) return configObject;
        }
        throw new Error("Không tìm thấy cấu hình hợp lệ");
      } catch (err) {
        throw new Error("Mã cấu hình không đúng định dạng JSON/JS Object");
      }
    }
  };

  const initFirebase = async (config) => {
    try {
      if (firebase.apps.length === 0) {
        firebase.initializeApp(config);
      } else {
        await firebase.app().delete();
        firebase.initializeApp(config);
      }
      db = firebase.firestore();
      auth = firebase.auth();
      const cred = await auth.signInAnonymously();
      setUser(cred.user);
      setIsFirebaseConnected(true);
      setSyncError('');
    } catch (error) {
      console.error(error);
      setIsFirebaseConnected(false);
      if (error.code === 'auth/operation-not-allowed') {
        setSyncError('Chưa bật Anonymous Authentication trên Firebase Console!');
      } else {
        setSyncError(error.message || 'Không thể kết nối Firebase');
      }
    }
  };

  // Init local / Firebase
  useEffect(() => {
    const savedConfig = localStorage.getItem('firebase_custom_config');
    if (savedConfig) {
      try {
        initFirebase(JSON.parse(savedConfig));
      } catch (e) {
        console.error(e);
      }
    } else {
      const savedMembers = localStorage.getItem('chore_members_fixed');
      const savedLogs = localStorage.getItem('chore_logs_fixed');
      if (savedMembers) setMembers(JSON.parse(savedMembers));
      if (savedLogs) setLogs(JSON.parse(savedLogs));
    }
  }, []);

  // Realtime Listeners
  useEffect(() => {
    if (!isFirebaseConnected || !db) return;

    const unsubMembers = db.collection('artifacts').doc(appId).collection('members')
      .onSnapshot((snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        if (list.length > 0) {
          const sorted = [];
          defaultOrder.forEach(id => {
            const found = list.find(m => m.id === id);
            if (found) sorted.push(found);
          });
          setMembers(sorted.length > 0 ? sorted : list);
        } else {
          members.forEach(m => {
            db.collection('artifacts').doc(appId).collection('members').doc(m.id).set(m);
          });
        }
      }, (error) => {
        console.error(error);
        setSyncError('Lỗi quyền Firestore! Hãy cập nhật Firestore Rules cho phép đọc/ghi.');
        setIsFirebaseConnected(false);
      });

    const unsubLogs = db.collection('artifacts').doc(appId).collection('logs')
      .onSnapshot((snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => b.timestamp - a.timestamp);
        setLogs(list);
      }, (error) => {
        console.error(error);
      });

    return () => {
      unsubMembers();
      unsubLogs();
    };
  }, [isFirebaseConnected]);

  // Clean old logs (>60 days so monthly stats remain accurate)
  useEffect(() => {
    if (!isFirebaseConnected || !db || logs.length === 0) return;
    const sixtyDaysAgo = Date.now() - (60 * 24 * 60 * 60 * 1000);
    const oldLogs = logs.filter(l => l.timestamp < sixtyDaysAgo);
    if (oldLogs.length > 0) {
      const batch = db.batch();
      oldLogs.forEach(l => {
        batch.delete(db.collection('artifacts').doc(appId).collection('logs').doc(l.id));
      });
      batch.commit().catch(console.error);
    }
  }, [logs, isFirebaseConnected]);

  const saveToLocal = (newMembers, newLogs) => {
    if (!isFirebaseConnected) {
      if (newMembers) {
        setMembers(newMembers);
        localStorage.setItem('chore_members_fixed', JSON.stringify(newMembers));
      }
      if (newLogs) {
        setLogs(newLogs);
        localStorage.setItem('chore_logs_fixed', JSON.stringify(newLogs));
      }
    }
  };

  const handleLogTask = async (memberId, selectedSubTaskId = null) => {
    if (!activeTaskForLog) return;
    const member = members.find(m => m.id === memberId);
    if (!member) return;

    const now = new Date();
    const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}`;
    
    let subTaskText = null;
    if (activeTaskForLog.id === 'khac') {
      if (selectedSubTaskId === 'khac_tuy_chinh') {
        subTaskText = customOtherText.trim() || 'Việc khác';
      } else {
        const found = subTasks.find(s => s.id === selectedSubTaskId);
        subTaskText = found ? found.name : 'Việc khác';
      }
    }

    const newLog = {
      id: Date.now().toString(),
      taskId: activeTaskForLog.id,
      taskName: activeTaskForLog.name,
      subTaskId: selectedSubTaskId,
      subTaskName: subTaskText,
      memberId: member.id,
      memberName: member.name,
      date: dateStr,
      timestamp: Date.now()
    };

    let updatedMembers = [...members];

    if (activeTaskForLog.id === 'khac') {
      updatedMembers = members.map(m => {
        if (m.id === member.id) {
          const nextCount = (m.khacCount || 0) + 1;
          const addedTickets = Math.floor(nextCount / 5);
          return {
            ...m,
            khacCount: nextCount % 5,
            exemptTickets: (m.exemptTickets || 0) + addedTickets
          };
        }
        return m;
      });
    }

    if (activeTaskForLog.id === 'do_rac' && member.exemptTickets > 0) {
      updatedMembers = updatedMembers.map(m => {
        if (m.id === member.id) {
          return { ...m, exemptTickets: Math.max(0, m.exemptTickets - 1) };
        }
        return m;
      });
      newLog.isExempted = true;
    }

    if (isFirebaseConnected && db) {
      try {
        const batch = db.batch();
        batch.set(db.collection('artifacts').doc(appId).collection('logs').doc(newLog.id), newLog);
        updatedMembers.forEach(m => {
          batch.set(db.collection('artifacts').doc(appId).collection('members').doc(m.id), m);
        });
        await batch.commit();
      } catch (err) {
        console.error(err);
      }
    } else {
      const updatedLogs = [newLog, ...logs];
      saveToLocal(updatedMembers, updatedLogs);
    }

    setActiveTaskForLog(null);
    setCustomOtherText('');
  };

  const handleManualFirebaseConfig = async () => {
    try {
      setSyncError('');
      const config = extractFirebaseConfig(firebaseInputConfig);
      localStorage.setItem('firebase_custom_config', JSON.stringify(config));
      await initFirebase(config);
      setShowConfigModal(false);
    } catch (e) {
      setSyncError(e.message || 'Cấu hình không hợp lệ');
    }
  };

  const handleAdminLogin = () => {
    if (adminPassword === 'phuc9') {
      setIsAdmin(true);
      setAdminPassword('');
      setAdminError('');
      setConfirmReset(false);
    } else {
      setAdminError('Mật khẩu không chính xác');
    }
  };

  const executeResetPoints = async () => {
    if (isFirebaseConnected && db) {
      try {
        const batch = db.batch();
        members.forEach(m => {
          batch.update(db.collection('artifacts').doc(appId).collection('members').doc(m.id), {
            khacCount: 0,
            exemptTickets: 0
          });
        });
        await batch.commit();
      } catch (err) {
        console.error(err);
      }
    } else {
      const reset = members.map(m => ({ ...m, khacCount: 0, exemptTickets: 0 }));
      saveToLocal(reset, null);
    }
    setConfirmReset(false);
    setShowAdminModal(false);
  };

  const executeDeleteLog = async () => {
    if (!logToDelete) return;
    const log = logToDelete;

    let updatedMembers = [...members];
    const memberIndex = members.findIndex(m => m.id === log.memberId);

    if (memberIndex !== -1) {
      let m = { ...members[memberIndex] };
      if (log.taskId === 'khac') {
        if (m.khacCount === 0) {
          m.khacCount = 4;
          m.exemptTickets = Math.max(0, (m.exemptTickets || 0) - 1);
        } else {
          m.khacCount -= 1;
        }
      } else if (log.taskId === 'do_rac' && log.isExempted) {
        m.exemptTickets = (m.exemptTickets || 0) + 1;
      }
      updatedMembers[memberIndex] = m;
    }

    if (isFirebaseConnected && db) {
      try {
        const batch = db.batch();
        batch.delete(db.collection('artifacts').doc(appId).collection('logs').doc(log.id));
        if (memberIndex !== -1) {
          batch.set(db.collection('artifacts').doc(appId).collection('members').doc(log.memberId), updatedMembers[memberIndex]);
        }
        await batch.commit();
      } catch (err) {
        console.error(err);
      }
    } else {
      const newLogs = logs.filter(l => l.id !== log.id);
      saveToLocal(updatedMembers, newLogs);
    }
    setLogToDelete(null);
  };

  const getLogsForTask = (taskId) => logs.filter(l => l.taskId === taskId);
  const getLatestLogForTask = (taskId) => {
    const t = getLogsForTask(taskId);
    return t.length > 0 ? t[0] : null;
  };
  const getMemberStats = (memberId) => logs.filter(l => l.memberId === memberId).length;

  // Streak Calculation for each member
  const memberStreaks = useMemo(() => {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const streaks = {};
    members.forEach(m => {
      const memberLogs = logs.filter(l => l.memberId === m.id);
      if (memberLogs.length === 0) {
        streaks[m.id] = 0;
        return;
      }

      // Unique sorted calendar days (timestamp at 00:00:00)
      const daySet = new Set();
      memberLogs.forEach(l => {
        const d = new Date(l.timestamp);
        d.setHours(0, 0, 0, 0);
        daySet.add(d.getTime());
      });
      const days = Array.from(daySet).sort((a, b) => b - a);

      let currentStreak = 0;
      let checkDate = new Date(today).getTime();
      const oneDay = 24 * 60 * 60 * 1000;

      // If logged today, start counting from today. Else check if logged yesterday to keep streak alive.
      if (days.includes(checkDate)) {
        currentStreak++;
        checkDate -= oneDay;
      } else {
        const yesterday = checkDate - oneDay;
        if (days.includes(yesterday)) {
          checkDate = yesterday;
        } else {
          streaks[m.id] = 0;
          return;
        }
      }

      while (days.includes(checkDate)) {
        currentStreak++;
        checkDate -= oneDay;
      }

      streaks[m.id] = currentStreak;
    });

    return streaks;
  }, [members, logs]);

  // Current Month Leaderboard & Achievements
  const monthlyData = useMemo(() => {
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    const monthLogs = logs.filter(l => {
      const d = new Date(l.timestamp);
      return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
    });

    // Count per member in this month
    const stats = {};
    const taskBreakdown = { do_rac: {}, don_ve_sinh: {}, don_bep: {}, khac: {} };

    members.forEach(m => {
      stats[m.id] = 0;
      taskBreakdown.do_rac[m.id] = 0;
      taskBreakdown.don_ve_sinh[m.id] = 0;
      taskBreakdown.don_bep[m.id] = 0;
      taskBreakdown.khac[m.id] = 0;
    });

    monthLogs.forEach(l => {
      if (stats[l.memberId] !== undefined) stats[l.memberId]++;
      if (taskBreakdown[l.taskId] && taskBreakdown[l.taskId][l.memberId] !== undefined) {
        taskBreakdown[l.taskId][l.memberId]++;
      }
    });

    const sortedMonthMembers = [...members].sort((a, b) => (stats[b.id] || 0) - (stats[a.id] || 0));

    // Find top winners for achievements
    const findTop = (map) => {
      let topId = null;
      let topVal = 0;
      Object.keys(map).forEach(id => {
        if (map[id] > topVal) {
          topVal = map[id];
          topId = id;
        }
      });
      if (!topId || topVal === 0) return { name: 'Chưa có', count: 0 };
      const m = members.find(x => x.id === topId);
      return { name: m ? m.name : '', count: topVal };
    };

    return {
      monthLabel: `Tháng ${currentMonth + 1}/${currentYear}`,
      totalMonthLogs: monthLogs.length,
      sortedMembers: sortedMonthMembers,
      stats,
      topOverall: findTop(stats),
      topTrash: findTop(taskBreakdown.do_rac),
      topToilet: findTop(taskBreakdown.don_ve_sinh),
      topKitchen: findTop(taskBreakdown.don_bep)
    };
  }, [members, logs]);

  const sortedMembers = useMemo(() => {
    return [...members].sort((a, b) => getMemberStats(b.id) - getMemberStats(a.id));
  }, [members, logs]);

  return (
    <div className="app-container">
      {/* Header */}
      <header className="header">
        <div className="brand-group">
          <div className="brand-logo"><Icons.Clock s={20} /></div>
          <div>
            <div className="brand-title">Chấm Công Phòng</div>
            <div className="brand-status">
              <span className={`status-dot ${isFirebaseConnected ? 'active' : ''}`} />
              {isFirebaseConnected ? 'Đang đồng bộ' : 'Chạy cục bộ (Offline)'}
            </div>
          </div>
        </div>
        <div className="header-actions">
          <button className="btn-icon" onClick={toggleTheme} title="Đổi giao diện">
            {theme === 'light' ? <Icons.Moon s={18} /> : <Icons.Sun s={18} />}
          </button>
          <button className="btn-icon" onClick={() => setShowConfigModal(true)} title="Cấu hình Sync">
            {isFirebaseConnected ? <Icons.Cloud s={18} /> : <Icons.CloudOff s={18} />}
          </button>
        </div>
      </header>

      {/* Main Content */}
      <main style={{ paddingTop: '12px' }}>
        {syncError && <div className="alert-banner">{syncError}</div>}

        {/* Tab 1: HOME */}
        {activeTab === 'home' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            {/* Streaks Header Strip */}
            <div>
              <div className="section-label">Chuỗi chăm chỉ (Streak)</div>
              <div className="streak-grid">
                {members.map(m => {
                  const s = memberStreaks[m.id] || 0;
                  return (
                    <div key={m.id} className={`streak-item ${s > 0 ? 'has-streak' : ''}`}>
                      <div className="streak-avatar">{m.name}</div>
                      <div className="streak-count mono">
                        <Icons.Flame s={13} />
                        <span>{s}d</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Reward System */}
            <div>
              <div className="section-label">Đổi vé miễn rác</div>
              <div className="reward-box">
                <div className="reward-header">
                  <span className="reward-badge"><Icons.Gift s={13} /> Tích luỹ việc khác</span>
                </div>
                <div className="reward-help">
                  Làm <b>5 lần việc khác</b> sẽ nhận được <b>1 vé miễn đổ rác</b> cho lần kế tiếp.
                </div>
                <div className="member-bars">
                  {members.map(m => (
                    <div key={m.id} className="member-bar-row">
                      <span className="member-bar-name">{m.name}</span>
                      <div className="progress-track">
                        <div className="progress-value" style={{ width: `${(m.khacCount || 0) * 20}%` }} />
                      </div>
                      <div className="member-bar-stat">
                        <span className="progress-text mono">{m.khacCount || 0}/5</span>
                        {(m.exemptTickets || 0) > 0 && (
                          <span className="ticket-chip"><Icons.Gift s={10} /> ×{m.exemptTickets}</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Task Cards */}
            <div>
              <div className="section-label">Nhiệm vụ trực nhật</div>
              <div className="task-grid">
                {tasks.map(task => {
                  const latest = getLatestLogForTask(task.id);
                  const taskLogs = getLogsForTask(task.id);
                  const IconComp = task.icon;

                  return (
                    <div key={task.id} className="task-box">
                      <div className="task-top">
                        <div className="task-meta">
                          <div className="task-icon-wrap"><IconComp s={20} /></div>
                          <div style={{ minWidth: 0 }}>
                            <div className="task-name">{task.name}</div>
                            <div className="task-recent">
                              {latest ? (
                                <>Gần nhất: <b>{latest.memberName}</b>{latest.subTaskName ? ` · ${latest.subTaskName}` : ''}</>
                              ) : (
                                <span>Chưa có dữ liệu</span>
                              )}
                            </div>
                          </div>
                        </div>
                        <button className="btn-add-log" onClick={() => { setActiveTaskForLog(task); setCustomOtherText(''); }} title="Ghi nhận">
                          <Icons.Plus s={18} />
                        </button>
                      </div>

                      <div className="task-strip-wrap">
                        <div className="task-strip">
                          {taskLogs.length > 0 ? (
                            taskLogs.map(log => (
                              <div key={log.id} className="log-pill">
                                <span className="log-pill-date mono">{log.date}</span>
                                <span className="log-pill-name">{log.memberName}</span>
                                {log.subTaskName && <span className="log-pill-sub">{log.subTaskName}</span>}
                                {log.isExempted && <span className="log-pill-exempt">Miễn</span>}
                                {isAdmin && (
                                  <button className="log-pill-del" onClick={() => setLogToDelete(log)}>
                                    <Icons.Trash s={11} />
                                  </button>
                                )}
                              </div>
                            ))
                          ) : (
                            <div className="strip-empty">Chưa có ai dọn gần đây...</div>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Total Overall Leaderboard */}
            <div>
              <div className="section-label">Tổng kết toàn thời gian</div>
              <div className="rank-box">
                {sortedMembers.map((member, i) => {
                  const total = getMemberStats(member.id);
                  const pct = logs.length ? ((total / logs.length) * 100).toFixed(1) : '0';
                  const topClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';

                  return (
                    <div key={member.id} className="rank-row">
                      <div className={`rank-num ${topClass}`}>{i + 1}</div>
                      <div className="rank-main">
                        <div className="rank-info">
                          <span>{member.name}</span>
                          <span className="rank-count mono">{total} lần · {pct}%</span>
                        </div>
                        <div className="rank-bar">
                          <div className="rank-bar-fill" style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* Tab 2: MONTHLY ACHIEVEMENTS */}
        {activeTab === 'monthly' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            <div>
              <div className="section-label">Thành tựu vinh danh {monthlyData.monthLabel}</div>
              <div className="achieve-grid">
                <div className="achieve-card">
                  <div className="achieve-badge-icon">👑</div>
                  <div className="achieve-title">Quán quân tháng</div>
                  <div className="achieve-winner">{monthlyData.topOverall.name}</div>
                  <div className="achieve-score mono">{monthlyData.topOverall.count} lần dọn dẹp</div>
                </div>

                <div className="achieve-card">
                  <div className="achieve-badge-icon">🗑️</div>
                  <div className="achieve-title">Chiến thần Đổ rác</div>
                  <div className="achieve-winner">{monthlyData.topTrash.name}</div>
                  <div className="achieve-score mono">{monthlyData.topTrash.count} lần đổ rác</div>
                </div>

                <div className="achieve-card">
                  <div className="achieve-badge-icon">✨</div>
                  <div className="achieve-title">Chúa tể Vệ sinh</div>
                  <div className="achieve-winner">{monthlyData.topToilet.name}</div>
                  <div className="achieve-score mono">{monthlyData.topToilet.count} lần cọ rửa</div>
                </div>

                <div className="achieve-card">
                  <div className="achieve-badge-icon">🍳</div>
                  <div className="achieve-title">Bếp trưởng Gọn gàng</div>
                  <div className="achieve-winner">{monthlyData.topKitchen.name}</div>
                  <div className="achieve-score mono">{monthlyData.topKitchen.count} lần dọn bếp</div>
                </div>
              </div>
            </div>

            <div>
              <div className="section-label">Bảng vàng {monthlyData.monthLabel}</div>
              <div className="rank-box">
                {monthlyData.sortedMembers.map((member, i) => {
                  const total = monthlyData.stats[member.id] || 0;
                  const pct = monthlyData.totalMonthLogs ? ((total / monthlyData.totalMonthLogs) * 100).toFixed(1) : '0';
                  const topClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';

                  return (
                    <div key={member.id} className="rank-row">
                      <div className={`rank-num ${topClass}`}>{i + 1}</div>
                      <div className="rank-main">
                        <div className="rank-info">
                          <span>{member.name}</span>
                          <span className="rank-count mono">{total} lần · {pct}%</span>
                        </div>
                        <div className="rank-bar">
                          <div className="rank-bar-fill" style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* Tab 3: FULL HISTORY */}
        {activeTab === 'history' && (
          <div>
            <div className="section-label">Toàn bộ lịch sử</div>
            <div className="history-feed">
              {logs.length > 0 ? (
                logs.map(log => {
                  const task = tasks.find(t => t.id === log.taskId);
                  const IconComp = task ? task.icon : Icons.Clock;

                  return (
                    <div key={log.id} className="feed-card">
                      <div className="feed-left">
                        <div className="feed-icon"><IconComp s={18} /></div>
                        <div>
                          <div className="feed-title"><b>{log.memberName}</b> · {log.taskName}</div>
                          {log.subTaskName && <div className="feed-sub">{log.subTaskName}</div>}
                          <div className="feed-date mono">{log.date} {log.isExempted && '· (Dùng vé miễn)'}</div>
                        </div>
                      </div>
                      {isAdmin && (
                        <button className="btn-del-log" onClick={() => setLogToDelete(log)}>
                          <Icons.Trash s={15} />
                        </button>
                      )}
                    </div>
                  );
                })
              ) : (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-dim)' }}>
                  <Icons.Clock s={32} />
                  <div style={{ marginTop: '8px', fontSize: '0.85rem' }}>Chưa có lịch sử dọn dẹp nào.</div>
                </div>
              )}
            </div>
          </div>
        )}
      </main>

      {/* Bottom Navigation */}
      <nav className="nav-bar">
        <button className={`nav-btn ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>
          <Icons.Clock s={18} />
          <span>Chấm công</span>
        </button>
        <button className={`nav-btn ${activeTab === 'monthly' ? 'active' : ''}`} onClick={() => setActiveTab('monthly')}>
          <Icons.Trophy s={18} />
          <span>Thành tựu</span>
        </button>
        <button className={`nav-btn ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
          <Icons.History s={18} />
          <span>Lịch sử</span>
        </button>
        <button className={`nav-btn ${isAdmin ? 'admin-active' : ''}`} onClick={() => setShowAdminModal(true)}>
          <Icons.Shield s={18} />
          <span>{isAdmin ? 'Admin (Bật)' : 'Admin'}</span>
        </button>
      </nav>

      {/* Member Selection Modal */}
      {activeTaskForLog && (
        <div className="modal-overlay" onClick={() => { setActiveTaskForLog(null); setCustomOtherText(''); }}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-header">
              <div>
                <div className="sheet-title">Ghi nhận: {activeTaskForLog.name}</div>
                <div className="sheet-desc">Ai vừa hoàn thành việc này?</div>
              </div>
              <button className="btn-icon" onClick={() => { setActiveTaskForLog(null); setCustomOtherText(''); }}><Icons.X s={16} /></button>
            </div>

            {activeTaskForLog.hasSubtasks && (
              <div style={{ marginBottom: '16px' }}>
                <div style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '8px' }}>CHI TIẾT VIỆC KHÁC</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  {subTasks.map(sub => (
                    <button
                      key={sub.id}
                      className={`subtask-btn ${customOtherText === sub.id ? 'selected' : ''}`}
                      onClick={() => setCustomOtherText(sub.id)}
                    >
                      {sub.name}
                    </button>
                  ))}
                  {customOtherText === 'khac_tuy_chinh' && (
                    <input
                      type="text"
                      placeholder="Nhập việc cụ thể (ví dụ: lau quạt, cọ gương)..."
                      value={customOtherText === 'khac_tuy_chinh' ? '' : customOtherText}
                      onChange={e => setCustomOtherText(e.target.value)}
                      autoFocus
                    />
                  )}
                </div>
              </div>
            )}

            <div>
              <div style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '8px' }}>CHỌN THÀNH VIÊN</div>
              <div className="grid-2">
                {members.map(member => (
                  <button
                    key={member.id}
                    className="member-select-btn"
                    onClick={() => {
                      if (activeTaskForLog.hasSubtasks && !customOtherText) {
                        alert('Vui lòng chọn loại việc khác trước!');
                        return;
                      }
                      const subVal = activeTaskForLog.id === 'khac'
                        ? (customOtherText === 'do_rac_bon_rua' ? 'do_rac_bon_rua' : customOtherText)
                        : null;
                      handleLogTask(member.id, subVal);
                    }}
                  >
                    <div>
                      <div className="member-select-name">{member.name}</div>
                      {member.exemptTickets > 0 && activeTaskForLog.id === 'do_rac' && (
                        <div className="member-select-tag">Dùng vé miễn</div>
                      )}
                    </div>
                    <Icons.Plus s={16} />
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Delete Confirmation Modal */}
      {logToDelete && (
        <div className="modal-overlay" onClick={() => setLogToDelete(null)}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-header">
              <div>
                <div className="sheet-title">Xác nhận xoá</div>
                <div className="sheet-desc">Lịch sử của <b>{logToDelete.memberName}</b> ({logToDelete.date})</div>
              </div>
              <button className="btn-icon" onClick={() => setLogToDelete(null)}><Icons.X s={16} /></button>
            </div>
            <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '16px' }}>
              Việc này sẽ xoá bản ghi và hoàn trả lại số điểm/vé tương ứng.
            </p>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button className="btn-secondary" onClick={() => setLogToDelete(null)}>Hủy</button>
              <button className="btn-danger" onClick={executeDeleteLog}>Xác nhận xoá</button>
            </div>
          </div>
        </div>
      )}

      {/* Admin Modal */}
      {showAdminModal && (
        <div className="modal-overlay" onClick={() => { setShowAdminModal(false); setAdminError(''); }}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-header">
              <div>
                <div className="sheet-title">Quản trị viên</div>
                <div className="sheet-desc">Quyền xoá và quản lý dữ liệu phòng</div>
              </div>
              <button className="btn-icon" onClick={() => { setShowAdminModal(false); setAdminError(''); }}><Icons.X s={16} /></button>
            </div>

            {!isAdmin ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                <input
                  type="password"
                  placeholder="Nhập mật khẩu quản trị..."
                  value={adminPassword}
                  onChange={e => setAdminPassword(e.target.value)}
                />
                {adminError && <div className="alert-banner" style={{ margin: 0 }}>{adminError}</div>}
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button className="btn-secondary" onClick={() => setShowAdminModal(false)}>Đóng</button>
                  <button className="btn-primary" onClick={handleAdminLogin}>Đăng nhập</button>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div style={{ padding: '12px', background: 'var(--accent-subtle)', color: 'var(--accent)', borderRadius: 'var(--radius-md)', fontSize: '0.85rem', fontWeight: 600 }}>
                  ✓ Đã kích hoạt quyền Admin. Bạn có thể xoá bất kỳ bản ghi nào trực tiếp.
                </div>

                <div>
                  <div style={{ fontSize: '0.8rem', fontWeight: 600, marginBottom: '6px' }}>Reset toàn bộ điểm thưởng</div>
                  <p style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginBottom: '10px' }}>
                    Đưa tất cả tiến trình tích luỹ và vé miễn về 0.
                  </p>
                  {!confirmReset ? (
                    <button className="btn-secondary" style={{ color: 'var(--danger)' }} onClick={() => setConfirmReset(true)}>
                      Đưa mọi điểm về 0
                    </button>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <div className="alert-banner" style={{ margin: 0 }}>Bạn có chắc chắn muốn reset điểm của cả phòng?</div>
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button className="btn-secondary" onClick={() => setConfirmReset(false)}>Hủy</button>
                        <button className="btn-danger" onClick={executeResetPoints}>Xác nhận Reset</button>
                      </div>
                    </div>
                  )}
                </div>

                <button className="btn-secondary" onClick={() => { setIsAdmin(false); setShowAdminModal(false); }}>
                  Đăng xuất Admin
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Firebase Sync Config Modal */}
      {showConfigModal && (
        <div className="modal-overlay" onClick={() => setShowConfigModal(false)}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-header">
              <div>
                <div className="sheet-title">Cấu hình Firebase Sync</div>
                <div className="sheet-desc">Dán đoạn cấu hình Firebase Console</div>
              </div>
              <button className="btn-icon" onClick={() => setShowConfigModal(false)}><Icons.X s={16} /></button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              <textarea
                rows={6}
                placeholder="Dán const firebaseConfig = { ... } vào đây"
                value={firebaseInputConfig}
                onChange={e => setFirebaseInputConfig(e.target.value)}
                className="mono"
                style={{ fontSize: '0.75rem' }}
              />
              <div style={{ display: 'flex', gap: '10px' }}>
                <button className="btn-secondary" onClick={() => setShowConfigModal(false)}>Đóng</button>
                <button className="btn-primary" onClick={handleManualFirebaseConfig}>Lưu & Kết nối</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
